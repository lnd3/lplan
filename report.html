<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Report</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #000000;
  --border: #cccccc;
  --stat-bg: #f5f5f5;
  --done-bg: #d4edda;
  --in-progress-bg: #fff3cd;
  --blocked-bg: #f8d7da;
  --idea-bg: #e2e3e5;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e;
    --fg: #e0e0e0;
    --border: #444444;
    --stat-bg: #2d2d2d;
    --done-bg: #1b3d1f;
    --in-progress-bg: #3d3a1f;
    --blocked-bg: #3d1b22;
    --idea-bg: #2a2a2a;
  }
}

:root[data-theme="dark"] {
  --bg: #1e1e1e;
  --fg: #e0e0e0;
  --border: #444444;
  --stat-bg: #2d2d2d;
  --done-bg: #1b3d1f;
  --in-progress-bg: #3d3a1f;
  --blocked-bg: #3d1b22;
  --idea-bg: #2a2a2a;
}

* {
  box-sizing: border-box;
}

body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  margin: 0;
  padding: 20px;
}

h1, h2, h3 {
  margin-top: 1.5em;
  margin-bottom: 0.5em;
}

h1 {
  border-bottom: 2px solid var(--border);
  padding-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
}

th, td {
  padding: 8px;
  text-align: left;
  border: 1px solid var(--border);
}

th {
  background-color: var(--stat-bg);
  font-weight: 600;
  cursor: pointer;
}

th:hover {
  opacity: 0.8;
}

tr:nth-child(even) {
  background-color: var(--stat-bg);
}

.stat-card {
  display: inline-block;
  background-color: var(--stat-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 15px;
  margin: 10px 10px 10px 0;
  text-align: center;
  min-width: 120px;
}

.stat-value {
  font-size: 1.8em;
  font-weight: bold;
  color: var(--fg);
}

.stat-label {
  font-size: 0.9em;
  color: var(--fg);
  opacity: 0.8;
}

.status-done {
  background-color: var(--done-bg);
}

.status-in-progress {
  background-color: var(--in-progress-bg);
}

.status-blocked {
  background-color: var(--blocked-bg);
}

.status-idea {
  background-color: var(--idea-bg);
}

.graph-container {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  margin: 1em 0;
}

svg {
  display: block;
}

.node {
  stroke: var(--border);
  stroke-width: 1;
}

.edge {
  stroke: var(--border);
  stroke-width: 1;
  fill: none;
  marker-end: url(#arrowhead);
}

.label {
  font-size: 11px;
  text-anchor: middle;
  dominant-baseline: middle;
}

.meta {
  font-size: 0.9em;
  color: var(--fg);
  opacity: 0.7;
  margin-top: 2em;
}
</style>
</head>
<body>

<h1>Plan Report</h1>
<p class="meta">Generated: 2026-08-21</p>

<h2>Summary</h2>
<div class="stat-cards">
<div class="stat-card">
<div class="stat-value">0</div>
<div class="stat-label">Projects</div>
</div>
<div class="stat-card">
<div class="stat-value">0</div>
<div class="stat-label">Designs</div>
</div>
<div class="stat-card">
<div class="stat-value">0</div>
<div class="stat-label">Actions</div>
</div>
<div class="stat-card">
<div class="stat-value">0%</div>
<div class="stat-label">Done</div>
</div>
<div class="stat-card">
<div class="stat-value">0</div>
<div class="stat-label">Blocked</div>
</div>
</div>
<h2>Projects</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Status</th>
<th>Priority</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
<h2>Dependency Graph</h2>
<div class="graph-container">
<p><em>No projects to visualize</em></p></div>

<div class="meta">
<p><small>Static HTML report. Open in any web browser. No external dependencies.</small></p>
</div>

</body>
</html>
